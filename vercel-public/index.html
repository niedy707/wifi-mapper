<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>WifiMapper — yalnızca lokal</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #0f172a; color: #e2e8f0; padding: 24px;
  }
  main { max-width: 34rem; text-align: center; }
  h1 { font-size: 1.4rem; margin: 0 0 .75rem; }
  p { margin: 0 0 .75rem; color: #94a3b8; }
  code {
    background: #1e293b; padding: .15em .45em; border-radius: 5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; color: #e2e8f0;
  }
</style>
</head>
<body>
<main>
  <h1>🛜 WifiMapper</h1>
  <p>Bu araç macOS'un WiFi tarama arayüzüne bağlıdır ve <strong>yalnızca lokal makinede</strong> çalışır.</p>
  <p>Çalıştırmak için: <code>npm start</code> → <code>http://localhost:3333</code></p>
  <p>Ölçüm verileri ve kat planları buluta yüklenmez; yalnızca lokal <code>data/</code> klasöründe tutulur.</p>
</main>
</body>
</html>
